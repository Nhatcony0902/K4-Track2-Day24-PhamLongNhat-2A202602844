title = "Day 24 synthetic secret exercise"

[extend]
useDefault = true

[[rules]]
id = "lab24-synthetic-token"
description = "A deliberately invalid lab token; never use real credentials"
regex = '''LAB24_FAKE_TOKEN=LAB24-DEMO-[A-Z0-9]{16}'''
keywords = ["LAB24_FAKE_TOKEN"]

# Môi trường ảo cục bộ (đã nằm trong .gitignore) chứa code bên thứ ba có
# chuỗi giống API key (vd. setuptools/_distutils/msvccompiler.py). Không phải
# file của repo nên loại khỏi `gitleaks dir`; `gitleaks git` không bị ảnh hưởng.
[[allowlists]]
description = "local virtualenv, not tracked by git"
paths = ['''(^|/)\.venv/''']
